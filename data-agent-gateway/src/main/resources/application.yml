server:
  port: ${DATA_AGENT_GATEWAY_PORT:8060}

spring:
  application:
    name: data-agent-gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DATA_AGENT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:dataagent-nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:DATA_AGENT_GROUP}
        health-indicator:
          enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:dataagent-nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:DATA_AGENT_GROUP}
    gateway:
      server:
        webflux:
          routes:
            - id: data-agent-agentscope-stream
              uri: lb://data-agent-agentscope
              predicates:
                - Path=/api/stream/**
            - id: data-agent-agentscope-memories
              uri: lb://data-agent-agentscope
              predicates:
                - Path=/api/memories/**
            - id: data-agent-agentscope-internal-model
              uri: lb://data-agent-agentscope
              predicates:
                - Path=/api/internal/model/**
            - id: data-agent-mcp-server
              uri: lb://data-agent-mcp-server
              predicates:
                - Path=/mcp/**
            - id: data-agent-management
              uri: lb://data-agent-management
              predicates:
                - Path=/api/**,/nl2sql/**,/echo/**,/uploads/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,nacosconfig,nacosdiscovery
  endpoint:
    gateway:
      access: read-only
