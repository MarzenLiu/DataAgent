services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: data-agent-mysql-inner
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nl2sql_db
#    volumes:
#      - nl2sql-mysql-inner-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-backend
      tags:
        - saa-data-agent-backend:1.0.0-SNAPSHOT
    container_name: data-agent-backend
    environment:
      - DATA_AGENT_DATASOURCE_URL=jdbc:mysql://mysql:3306/nl2sql_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATA_AGENT_DATASOURCE_USERNAME=root
      - DATA_AGENT_DATASOURCE_PASSWORD=root
      - DATA_AGENT_DATASOURCE_SQL_INIT=always
      - AI_DASHSCOPE_API_KEY=${AI_DASHSCOPE_API_KEY}
      - DOCLING_ENABLED=true
      - DOCLING_BASE_URL=http://docling-serve:5001
      - DOCLING_API_KEY=${DOCLING_API_KEY:-data-agent-docling}
    ports:
      - "8065:8065"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-data:
        condition: service_healthy
      postgres-data:
        condition: service_healthy
      docling-serve:
        condition: service_healthy
    networks:
      - app-network
    restart: no

  # PDF/XLSX结构化解析服务
  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.21.0
    container_name: data-agent-docling
    environment:
      - DOCLING_SERVE_API_KEY=${DOCLING_API_KEY:-data-agent-docling}
      - DOCLING_SERVE_ENABLE_UI=false
      - DOCLING_SERVE_MAX_FILE_SIZE=${DOCLING_MAX_FILE_SIZE:-104857600}
      - DOCLING_SERVE_MAX_NUM_PAGES=${DOCLING_MAX_NUM_PAGES:-500}
    volumes:
      - docling-models:/root/.cache
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)\"" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Vue前端服务
  frontend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-frontend
      tags:
        - saa-data-agent-frontend:1.0.0-SNAPSHOT
    container_name: data-agent-frontend
    ports:
      - "3000:3000"  # 只暴露前端端口
    depends_on:
      - backend
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    restart: unless-stopped

  # MySQL 模拟数据源
  mysql-data:
    image: mysql:8.0
    container_name: data-agent-mysql-datasource
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network
    volumes:
      - ./config/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 模拟数据源
  postgres-data:
    image: postgres:15
    container_name: data-agent-postgres-datasource
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    volumes:
      - ./config/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data-agent-mysql-inner-data:
  docling-models:

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"
