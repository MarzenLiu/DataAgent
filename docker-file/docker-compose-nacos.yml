name: data-agent-nacos

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: data-agent-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-RGF0YUFnZW50TmFjb3NBdXRoVG9rZW5Gb3JEZXZlbG9wbWVudE9ubHkyMDI2}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-dataAgentNacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-dataAgentNacosIdentity2026}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-8080}:8080"
      - "127.0.0.1:${NACOS_SERVER_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v3/admin/core/state/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  nacos-init:
    image: curlimages/curl:8.16.0
    user: "0:0"
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_URL: http://nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-dataagent-nacos}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-DATA_AGENT_GROUP}
    volumes:
      - ./config/nacos:/config:ro
      - ./config/nacos-init.sh:/nacos-init.sh:ro
      - nacos-init-state:/state
    entrypoint: ["/bin/sh", "/nacos-init.sh"]
    restart: "no"

volumes:
  nacos-data:
  nacos-init-state:
