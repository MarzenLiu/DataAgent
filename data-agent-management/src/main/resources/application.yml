server:
  port: 8065

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 存储 DataAgent 业务数据的数据库，并非Agent分析数据的来源
spring:
  profiles:
    # Local development now uses Milvus by default. Set
    # SPRING_PROFILES_ACTIVE to another profile to override it.
    default: ${DATA_AGENT_DEFAULT_PROFILE:milvus}
  codec:
    # WebFlux decodes request bodies with a 256KB default buffer, which is too
    # small for larger chat messages persisted through the messages endpoint.
    max-in-memory-size: 2MB
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/saa_data_agent?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
      separator: ;
      encoding: utf-8
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      # application-milvus.yml overrides this when the default milvus profile is active.
      type: simple
    alibaba:
      data-agent:
        vector-store:
          table-topk-limit: 10
          table-similarity-threshold: 0.2
          default-topk-limit: 8
          default-similarity-threshold: 0.4
        code-executor:
          # 运行Python代码的环境（生产环境建议使用docker，不建议使用local）
          code-pool-executor: local
          # Python执行的最大重试次数
          python-max-tries-count: 5
        file:
          type: local
          path-prefix: data-agent
          # 当前目录下不要用点， ./uploads win下拼接完整格式路径会解析不了，比如 data-agent/./uploads win识别不了
          path: uploads
          url-prefix: /uploads
          imageSize: 2097152
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        docling:
          enabled: ${DOCLING_ENABLED:true}
          base-url: ${DOCLING_BASE_URL:http://localhost:5001}
          api-key: ${DOCLING_API_KEY:}
          connect-timeout: ${DOCLING_CONNECT_TIMEOUT:5s}
          read-timeout: ${DOCLING_READ_TIMEOUT:10m}
          async-poll-interval: ${DOCLING_POLL_INTERVAL:2s}
          async-timeout: ${DOCLING_ASYNC_TIMEOUT:15m}
          fallback-to-tika: ${DOCLING_FALLBACK_TO_TIKA:true}
          pdf:
            ocr-enabled: ${DOCLING_PDF_OCR_ENABLED:true}
            max-table-rows-per-chunk: ${DOCLING_PDF_TABLE_ROWS:20}
          excel:
            max-table-rows-per-chunk: ${DOCLING_EXCEL_TABLE_ROWS:50}
        max-sql-retry-count: 10
        # Langfuse 可观测性配置
        langfuse:
          enabled: ${LANGFUSE_ENABLED:false}
          host: ${LANGFUSE_HOST:}
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          secret-key: ${LANGFUSE_SECRET_KEY:}
  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

mybatis:

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: info
    com.alibaba.cloud.ai.dataagent.workflow.node: info
    com.alibaba.cloud.ai.mapper: info
    org.springframework.jdbc: info
