server:
  port: 8065

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 存储 DataAgent 业务数据的数据库，并非Agent分析数据的来源
spring:
  profiles:
    # Local development now uses Milvus by default. Set
    # SPRING_PROFILES_ACTIVE to another profile to override it.
    default: ${DATA_AGENT_DEFAULT_PROFILE:milvus}
  codec:
    # WebFlux decodes request bodies with a 256KB default buffer, which is too
    # small for larger chat messages persisted through the messages endpoint.
    max-in-memory-size: 2MB
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/saa_data_agent?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
      separator: ;
      encoding: utf-8
  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

data-agent:
  agentscope:
    base-url: ${AGENTSCOPE_BASE_URL:http://127.0.0.1:8066}
  vector-store:
    type: simple
    file-path: ${VECTOR_STORE_PATH:./vectorstore/vectorstore.json}
    table-topk-limit: 10
    table-similarity-threshold: 0.2
    default-topk-limit: 8
    default-similarity-threshold: 0.4
  file:
    type: local
    path-prefix: data-agent
    path: uploads
    url-prefix: /uploads
    imageSize: 2097152
    oss:
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      endpoint: ${OSS_ENDPOINT:}
      bucket-name: ${OSS_BUCKET_NAME:}
      custom-domain: ${OSS_CUSTOM_DOMAIN:}
  docling:
    enabled: ${DOCLING_ENABLED:true}
    base-url: ${DOCLING_BASE_URL:http://localhost:5001}
    # The bundled local Docling container uses this development key by default.
    # Production deployments should override DOCLING_API_KEY explicitly.
    api-key: ${DOCLING_API_KEY:data-agent-docling}
    connect-timeout: ${DOCLING_CONNECT_TIMEOUT:5s}
    read-timeout: ${DOCLING_READ_TIMEOUT:95m}
    async-poll-interval: ${DOCLING_POLL_INTERVAL:2s}
    async-timeout: ${DOCLING_ASYNC_TIMEOUT:90m}
    fallback-to-tika: ${DOCLING_FALLBACK_TO_TIKA:true}
    hybrid-chunking:
      enabled: ${DOCLING_HYBRID_CHUNKING_ENABLED:true}
      max-tokens: ${DOCLING_HYBRID_MAX_TOKENS:512}
      tokenizer: ${DOCLING_HYBRID_TOKENIZER:sentence-transformers/all-MiniLM-L6-v2}
      merge-peers: ${DOCLING_HYBRID_MERGE_PEERS:true}
      use-markdown-tables: ${DOCLING_HYBRID_MARKDOWN_TABLES:true}
    pdf:
      ocr-enabled: ${DOCLING_PDF_OCR_ENABLED:true}
      backend: ${DOCLING_PDF_BACKEND:PYPDFIUM2}
      include-images: ${DOCLING_PDF_INCLUDE_IMAGES:false}
      table-structure-enabled: ${DOCLING_PDF_TABLE_STRUCTURE_ENABLED:true}
      table-mode: ${DOCLING_PDF_TABLE_MODE:FAST}
      max-table-rows-per-chunk: ${DOCLING_PDF_TABLE_ROWS:20}
    excel:
      max-table-rows-per-chunk: ${DOCLING_EXCEL_TABLE_ROWS:50}
    word:
      max-table-rows-per-chunk: ${DOCLING_WORD_TABLE_ROWS:30}

mybatis:

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: info
    com.alibaba.cloud.ai.dataagent.workflow.node: info
    com.alibaba.cloud.ai.mapper: info
    org.springframework.jdbc: info
